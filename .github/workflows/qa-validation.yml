name: QA Validation

on:
  workflow_call:
    secrets:
      CLIENT_ID:
        required: true
      SERVER_KEY:
        required: true
      SF_USERNAME:
        required: true
      SF_INSTANCE_URL:
        required: false

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Authenticate to Salesforce (reusable workflow)
        uses: shriyanshmishra/Structured-Pipeline/.github/workflows/qa-authentication.yml@qa
        id: auth
        secrets:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}

      - name: Detect changed metadata
        run: |
          git fetch origin qa
          git diff --name-only origin/qa...HEAD > changed_files.txt
          grep '^force-app/main/default/' changed_files.txt > filtered_changed_files.txt || true

      - name: Generate package.xml
        run: |
          mkdir -p manifest
          node scripts/generate-package-xml.js filtered_changed_files.txt manifest/package.xml

      - name: Validate deployment (check-only)
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org myqaorg \
            --checkonly \
            --test-level RunLocalTests \
            --wait 40