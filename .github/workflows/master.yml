name: Master QA Pipeline

on:
  pull_request:
    branches:
      - qa
  push:
    branches:
      - qa

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli@latest --global

      - name: Write JWT key to file
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          echo "$SERVER_KEY" > server.key
          chmod 600 server.key

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Authenticate to Salesforce
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: ./scripts/authenticate.sh

      - name: Validate deployment (check-only)
        if: github.event_name == 'pull_request'
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: ./scripts/validate.sh

      - name: Deploy to Salesforce
        if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: ./scripts/deploy.sh